name: PixelPet
options:
  bundleIdPrefix: com.wmr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  knownRegions:
    - zh-Hans
    - en
    - Base

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    # 调试面板（时间快进 / 跳阶段 / 重置存档）只在 Debug 编译进去。
    # Release 产物里连符号都不存在，比运行时隐藏更彻底。
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

targets:
  PixelPetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PixelPet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wmr.pixelpet.tests
        GENERATE_INFOPLIST_FILE: YES

  PixelPetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      # ⚠️ **共用同一份 identifier 常量。**
      #
      # UI 测试跑在独立进程里，拿不到 app target 的类型
      # （XCUITest 是黑盒测试，不能 @testable import）。
      # 两边各抄一份字符串是最容易腐烂的做法 —— 改一处忘一处，
      # 测试会以「找不到元素」失败，而那个报错完全不提示真正的原因。
      # 直接把常量文件也编进测试 target，这也是当初把它放在
      # Core（不依赖任何业务类型）的理由。
      - path: Sources/Core/Accessibility/A11y.swift
    dependencies:
      - target: PixelPet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wmr.pixelpet.uitests
        GENERATE_INFOPLIST_FILE: YES
        # UI 测试要读 PetScene 的布局快照，那是 #if DEBUG 的。
        # 用 Release 跑这个 target 会因为符号不存在而失败 ——
        # 这是预期行为，不是 bug（见 A11y.sceneSnapshot 的注释）。
        TEST_TARGET_NAME: PixelPet

  PixelPet:
    type: application
    platform: iOS
    preBuildScripts:
      # 分层依赖检查。拆 SPM 模块能让编译器强制分层，但对这个规模
      # 成本过高（见 docs/06-architecture.md），用脚本达到同样约束。
      - script: ./tools/check_layers.sh
        name: Check layer dependencies
        basedOnDependencyAnalysis: false
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        optional: true
      - path: Assets
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wmr.pixelpet
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: PixelPet
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "开启后，宠物饿了或无聊时会提醒你。"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
