name: PixelPet
options:
  bundleIdPrefix: com.wmr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  knownRegions:
    - zh-Hans
    - en
    - Base

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    # 调试面板（时间快进 / 跳阶段 / 重置存档）只在 Debug 编译进去。
    # Release 产物里连符号都不存在，比运行时隐藏更彻底。
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

targets:
  PixelPetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PixelPet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wmr.pixelpet.tests
        GENERATE_INFOPLIST_FILE: YES

  PixelPet:
    type: application
    platform: iOS
    preBuildScripts:
      # 分层依赖检查。拆 SPM 模块能让编译器强制分层，但对这个规模
      # 成本过高（见 docs/06-architecture.md），用脚本达到同样约束。
      - script: ./tools/check_layers.sh
        name: Check layer dependencies
        basedOnDependencyAnalysis: false
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        optional: true
      - path: Assets
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wmr.pixelpet
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: PixelPet
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "开启后，宠物饿了或无聊时会提醒你。"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
