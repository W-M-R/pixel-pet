name: PixelPet
options:
  bundleIdPrefix: com.wmr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  knownRegions:
    - zh-Hans
    - en
    - Base

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  PixelPetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PixelPet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wmr.pixelpet.tests
        GENERATE_INFOPLIST_FILE: YES

  PixelPet:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        optional: true
      - path: Assets
        buildPhase: resources
        optional: true
      # LFM2-350M CoreML 模型 (170MB) + tokenizer。
      # .mlpackage 会被 Xcode 自动编译成 .mlmodelc。
      # 模型不入 git（见 .gitignore），由 tools/convert/to_coreml.py 生成。
      - path: Models
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wmr.pixelpet
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: PixelPet
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
