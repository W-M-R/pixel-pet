name: PixelPet
options:
  bundleIdPrefix: com.wmr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # 与 Resources/*.xcstrings 铺进的语言严格一致 —— 少一项，
  # 该语言的译文即使填了也不会被打进包。
  knownRegions:
    - en
    - zh-Hans
    - zh-Hant
    - ja
    - ko
    - de
    - fr
    - es
    - it
    - pt-BR
    - ru
    - ar
    - hi
    - th
    - id
    - tr
    - nl
    - sv
    - pl
    - vi
    - Base

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    # DEVELOPMENT_TEAM 不写在这里 —— 见 Config/Shared.xcconfig。
    # 写死会让克隆者签名失败（他们签不进我的团队）。
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    # build 号。**每次向 ASC 上传都必须递增**，同号会被拒收
    # （`redundant binary upload`）。
    # 两次 ITMS-91056（都拒在 PrivacyInfo.xcprivacy，但根因不同）：
    #   1 → 2：文件写成了 JSON，必须是 plist(XML)。
    #   2 → 3：已是合法 plist、plutil -lint 也报 OK，但注释里写了含双连字符
    #          的命令行示例；XML 禁止注释内出现它，Apple 校验器据此判 invalid。
    # 教训：plutil 通过不充分，要用严格 XML 解析（plistlib）验。详见该文件注释。
    # 版本号 1.0 不变，只换 build。
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    # 调试面板（时间快进 / 跳阶段 / 重置存档）只在 Debug 编译进去。
    # Release 产物里连符号都不存在，比运行时隐藏更彻底。
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

targets:
  PixelPetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PixelPet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wmr.pixelpet.tests
        GENERATE_INFOPLIST_FILE: YES

  PixelPetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      # ⚠️ **共用同一份 identifier 常量。**
      #
      # UI 测试跑在独立进程里，拿不到 app target 的类型
      # （XCUITest 是黑盒测试，不能 @testable import）。
      # 两边各抄一份字符串是最容易腐烂的做法 —— 改一处忘一处，
      # 测试会以「找不到元素」失败，而那个报错完全不提示真正的原因。
      # 直接把常量文件也编进测试 target，这也是当初把它放在
      # Core（不依赖任何业务类型）的理由。
      - path: Sources/Core/Accessibility/A11y.swift
    dependencies:
      - target: PixelPet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wmr.pixelpet.uitests
        GENERATE_INFOPLIST_FILE: YES
        # UI 测试要读 PetScene 的布局快照，那是 #if DEBUG 的。
        # 用 Release 跑这个 target 会因为符号不存在而失败 ——
        # 这是预期行为，不是 bug（见 A11y.sceneSnapshot 的注释）。
        TEST_TARGET_NAME: PixelPet

  PixelPet:
    type: application
    platform: iOS
    preBuildScripts:
      # 分层依赖检查。拆 SPM 模块能让编译器强制分层，但对这个规模
      # 成本过高（见 docs/06-architecture.md），用脚本达到同样约束。
      - script: ./tools/check_layers.sh
        name: Check layer dependencies
        basedOnDependencyAnalysis: false
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        optional: true
      - path: Assets
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wmr.pixelpet
        # ⚠️ **必须写在 target 级，不能只写工程级。**
        #
        # 上面 `settings.base` 里那份（工程级）会被 XcodeGen 自动给 iOS app
        # target 补的默认值 `"1,2"` 覆盖掉 —— target 级优先。
        # 实测后果：ipa 的 Info.plist 里 UIDeviceFamily = [1, 2]，
        # app 变成「通用」，于是
        #   ① App Store Connect 多出一个 iPad 截图槽，不传满就无法提审；
        #   ② 归档时报 "All interface orientations must be supported
        #      unless the app requires full screen"（iPad 多任务规则）。
        # 这个 app 只做 iPhone（竖屏、像素场景按 iPhone 比例排版）。
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # 出口合规：全项目零 URLSession/URLRequest（见 AboutView 的注释），
        # 声明豁免后 ASC 不会反复弹加密问卷。
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # 不要在这里加 CFBundleLocalizations：INFOPLIST_KEY_* 只支持标量键的白名单，
        # 数组类型的它会被 Xcode 静默丢弃（试过，Info.plist 里查不到）。
        # 而且本来不需要 —— iOS 从包内的 *.lproj 目录推导支持语言，
        # 语言集由下面的 knownRegions + Resources/*.xcstrings 决定。
        # 显示名与权限文案的**基准值走英文** —— 它同时是 en 和所有
        # 未翻译语言的兜底。各语言译名由 Resources/InfoPlist.xcstrings 覆盖
        # （中文系统显示「像素小宠」）。写死单一名字的话，
        # 图标名不会随系统语言变。
        INFOPLIST_KEY_CFBundleDisplayName: PixelPet
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Get a nudge when your pet is hungry or bored."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
