# 冒烟流程：从全新存档走完主路径。
#
# 抓的是「崩溃 / 白屏 / 点了没反应」这类硬问题 ——
# 235 条单测覆盖逻辑层，但 SwiftUI 视图和手势一条都没覆盖。
# 前几轮吃饭站位反复出错，根因就是这个盲区。
#
# ## 全部用 accessibilityIdentifier 定位
#
# 第一版用的是**屏幕坐标**（`point: "91%,10%"`），因为状态栏那五个
# 入口是纯图标按钮、当时没有任何无障碍标识。那个方案的代价是
# 换机型就得重新量，而且坐标读起来完全不知道点的是什么。
#
# 现在按钮都加了 id（见 `Sources/Core/Accessibility/A11y.swift`），
# 所以这里改成 id 定位 —— 与机型、语言、布局都解耦。
#
# 顺带说明为什么当初非用坐标不可，这也是加 id 的真正理由：
# 那五个按钮在无障碍层级里 `accessibilityText` 全是空的，
# **VoiceOver 用户只会听到「按钮」**，听不出是商店还是设置。
# 那是个该修的缺陷，不只是测试不方便。
#
# ## 两个 Maestro 坑（踩过，留个记录）
#
# - **坐标百分比只能用整数**：写 `"91%,10.5%"` 会抛
#   `NumberFormatException`（内部用 `Integer.parseInt` 解析）
# - **`hideKeyboard` 在这个 app 上报「Couldn't hide the keyboard」** ——
#   起名输入框用的是 `.submitLabel(.done)`，走 `pressKey: Enter` 才对
#
# 用法：maestro test .maestro/smoke.yml
appId: com.wmr.pixelpet
---
- launchApp:
    clearState: true

# ---------- 开局引导 ----------
- assertVisible: "选择你的宠物"
- assertVisible:
    id: "onboard.breed.cat"
- assertVisible:
    id: "onboard.breed.dog"
- assertVisible: "5000"            # 启动资金要显示出来
- takeScreenshot: .probe/smoke/01-pick-breed

# 选小狗（默认是猫，选另一个才能验证「切换品种」这条路径）
- tapOn:
    id: "onboard.breed.dog"
- takeScreenshot: .probe/smoke/02-picked-dog

- tapOn:
    id: "onboard.next"
- assertVisible:
    id: "onboard.nameField"
- takeScreenshot: .probe/smoke/03-name-step

# 验证「返回」能回到选品种 —— 这条路径容易在改动中被弄坏
- tapOn:
    id: "onboard.back"
- assertVisible: "选择你的宠物"
- tapOn:
    id: "onboard.next"

# 起名。用 id 而不是文案 —— 输入框的占位符和页面标题是**同一句**
# （`settings.name.placeholder`），按文案点会命中标题，
# 结果键盘没开、输入落空、名字存成空字符串。
- tapOn:
    id: "onboard.nameField"
- inputText: "Rex"
- pressKey: Enter
- takeScreenshot: .probe/smoke/04-named

- tapOn:
    id: "onboard.next"
- assertNotVisible:
    id: "onboard.nameField"
# 名字要出现在主页 —— 这同时验证了起名真的存进去了
- assertVisible: "Rex"
- takeScreenshot: .probe/smoke/05-home

# ---------- 主页三个交互 ----------
- assertVisible:
    id: "action.feed"
- assertVisible:
    id: "action.play"
- assertVisible:
    id: "action.clean"
- assertVisible:
    id: "home.need"        # 当前需求图标（VoiceOver 要能读出来）

# 喂食走食物选择弹窗
- tapOn:
    id: "action.feed"
- assertVisible: "喂点什么？"
- takeScreenshot: .probe/smoke/06-food-picker
- tapOn:
    id: "food.kibble"
- takeScreenshot: .probe/smoke/07-after-feed

# 选完食物 sheet 必定自动关（`FoodPickerView.row` 里直接调 `dismiss()`）。
#
# ⚠️ 这里曾写成 `runFlow: when: visible: common.done` 来「兼容两种情况」，
# 但那个情况根本不存在 —— 而条件块本身把整个流程挂死了
# （跑到这一步就不动，等到看门狗超时）。
# 为不可能发生的分支加防御，代价是流程卡住且没有任何报错。
- assertNotVisible:
    id: "common.done"
- assertVisible:
    id: "action.play"

- tapOn:
    id: "action.play"
- takeScreenshot: .probe/smoke/08-after-play

- tapOn:
    id: "action.clean"
- takeScreenshot: .probe/smoke/09-after-clean
- assertVisible:
    id: "action.feed"      # 交互后还在主页，没崩

# ---------- 五个页面能开能关 ----------
- tapOn:
    id: "home.settings"
- assertVisible:
    id: "common.done"
- takeScreenshot: .probe/smoke/10-settings
- tapOn:
    id: "common.done"

- tapOn:
    id: "home.pets"
- assertVisible:
    id: "common.done"
- takeScreenshot: .probe/smoke/11-pets
- tapOn:
    id: "common.done"

- tapOn:
    id: "home.shop"
- assertVisible:
    id: "common.done"
- takeScreenshot: .probe/smoke/12-shop
- tapOn:
    id: "common.done"

- tapOn:
    id: "home.achievements"
- assertVisible:
    id: "common.done"
- takeScreenshot: .probe/smoke/13-achievements
- tapOn:
    id: "common.done"

- tapOn:
    id: "home.coins"
- assertVisible:
    id: "common.done"
- takeScreenshot: .probe/smoke/14-earnings
- tapOn:
    id: "common.done"

# ---------- 收尾 ----------
- assertVisible:
    id: "action.feed"
- assertVisible: "Rex"
- takeScreenshot: .probe/smoke/15-back-home
